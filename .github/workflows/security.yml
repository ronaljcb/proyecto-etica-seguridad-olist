name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"   # cada lunes: detecta nuevas CVE en dependencias ya publicadas
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm --prefix frontend ci
      - name: Compilar frontend
        run: npm --prefix frontend run build
      - name: Bandit + pip-audit + npm audit + pytest
        run: scripts/security_scan.sh
      - name: Buscar secretos en todo el historial (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-seguridad
          path: informe/evidencias/
